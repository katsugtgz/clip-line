[package]
name = "clip-line-x11"
description = "X11 capture and paste adapters for clipLine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clip-line-core = { path = "../clip-line-core" }
anyhow.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
x11rb = { version = "0.14", features = ["xfixes", "xtest"] }
